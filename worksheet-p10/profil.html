<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <!-- urutan ini yang benar: token -> dasar -> tata letak -> komponen -> tema -> responsif -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="komponen.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="responsif.css">
</head>
<body>
  <div class="page">

  <!-- TODO C.1: buat <header> di sini.
       Isinya: satu <h1> berisi judul halaman Anda.
       Di dalamnya juga ada <nav> berisi 3 tautan ke bagian halaman. -->
  <header>
    <input type="checkbox" id="tema" class="pengalih-tema">
    <label for="tema" class="tombol-tema">Tema gelap</label>
    <div class="navbar">
      <h1></h1>
      <nav aria-label="Navigasi utama">
        <ul>
          <li><a href="#data-film">Data Film</a></li>
          <li><a href="#rekomendasi">Rekomendasi</a></li>
          <li><a href="#kontak">Kontak</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- TODO C.2: buat <main> di sini sebagai pembungkus semua bagian isi.
       Di dalamnya ada 2 <section>, masing-masing punya <h2> sendiri. -->
  <main class="isi content">
    <section id="data-film" class="utama">
      <h2>Daftar Film Favorit</h2>

      <figure>
  <img
    src="https://cdn.pixabay.com/photo/2016/01/22/08/20/film-1155439_640.jpg"
    alt="Film dengan kamera dan suasana sinema yang menarik"
    width="640"
    height="360"
    loading="lazy">
  <figcaption>Film favorit yang paling sering saya tonton.</figcaption>
</figure>
<div id="filter">
  <button type="button" data-kategori="semua">Semua</button>
  <button type="button" data-kategori="selesai">Selesai</button>
  <button type="button" data-kategori="proses">Dalam Proses</button>
</div>
<ul id="daftar" class="galeri grid"></ul>
<p id="kosong" hidden>Tidak ada proyek yang sesuai.</p>
</section>

    <section id="rekomendasi" class="sisi">
      <h2>Formulir Rekomendasi Film</h2>

      <!-- TODO E.1: di dalam section kedua, buat form Anda.
           Wajib ada: minimal 3 kolom, setiap kolom punya <label for> yang
           cocok dengan id input-nya, dan satu atribut validasi. -->
      <form action="#" method="post">
        <p class="form-kolom">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
        <small class="pesan-error" id="error-nama"></small>
        </p>

        <p class="form-kolom">
          <label for="film">Judul Film</label>
          <input type="text" id="film" name="film" placeholder="Contoh: Interstellar" required>
          <small class="pesan-error" id="error-film"></small>
          <small class="pesan-error" id="error-genre"></small>
        </p>

        <p class="form-kolom">
          <label for="genre">Genre</label>
          <input type="text" id="genre" name="genre" placeholder="Contoh: Fantasy" required>
        </p>

        <button type="submit">Kirim Rekomendasi</button>
      </form>
    </section>
  </main>

  <!-- TODO C.3: buat <footer> di sini.
       Isinya: nama Anda, NIM Anda, dan tahun. -->
  <footer id="kontak">
    <p>Nama: Annas Pascal Handoko NIM: 25523263 Tahun: 2026</p>
  </footer>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dom.js"></script>
</body>
</html>
